  <line x1="715" y1="450" x2="960" y2="450" stroke="#ddd6ca" stroke-width="1.5"/>
  <text x="715" y="480" font-size="15" fill="#6d665c"><tspan font-weight="600" fill="#2a2723">3 to 6 are optional.</tspan><tspan x="715" dy="21">Any charger and cable keep</tspan><tspan x="715" dy="21">the phone running. These parts</tspan><tspan x="715" dy="21">keep the cable flat and hidden.</tspan></text>
