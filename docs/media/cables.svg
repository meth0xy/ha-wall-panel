    <text x="748" y="118">Old phone in landscape,<tspan x="748" dy="20">running the panel app</tspan></text>
    <circle cx="727" cy="173" r="11" fill="#d97b2b"/><text x="727" y="178" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="748" y="178">Double-sided tape on<tspan x="748" dy="20">the intercom cover</tspan></text>
    <circle cx="727" cy="233" r="11" fill="#d97b2b"/><text x="727" y="238" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
