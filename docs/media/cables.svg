<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How the phone is mounted and powered</title>
  <desc id="desc">An old phone in landscape sits on top of a door intercom cover, held by double-sided tape. A 90 degree flat USB-C cable leaves the phone, joins a USB-C coupler, and continues as a flat USB cable clipped along the door frame down to a USB charger in the wall socket. Parts 3 to 6 are optional.</desc>
