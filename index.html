<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <div class="top no-tasks">
      <aside class="info">
        <div>
          <div id="time" class="time">--:--</div>
          <div id="date" class="date">—</div>
        </div>
        <div class="weather">
          <div class="weather-temp"><span id="temp">—</span>°</div>
          <div>
            <div id="condition" class="condition">—</div>
            <div id="room" class="room">—</div>
          </div>
        </div>
      </aside>
      <section id="agenda" class="agenda"></section>
      <section id="tasks" class="tasks"></section>
    </div>
    <div id="strip" class="strip"></div>
  </main>
  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
