<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Home</title>
  <script>
    /* Home Assistant serves /local with a month-long max-age and a reload reuses those copies, so every load asks under a new URL. */
    const fresh = (file) => `${file}?v=${Date.now()}`;
    document.write(`<link rel="stylesheet" href="${fresh("styles.css")}" />`);
  </script>
</head>
<body>
  <main class="app">
    <div class="top">
      <aside class="info">
        <div>
          <div id="clock">
            <div id="time" class="time">--:--</div>
            <div id="date" class="date">—</div>
          </div>
          <button id="switch" class="switch" hidden></button>
        </div>
        <div class="weather">
          <div class="weather-temp"><span id="temp">—</span>°</div>
          <div>
            <div id="condition" class="condition">—</div>
            <div id="room" class="room">—</div>
          </div>
        </div>
      </aside>
      <div class="stage">
        <section id="agenda" class="agenda"></section>
        <section id="tasks" class="tasks"></section>
      </div>
    </div>
    <div id="strip" class="strip"></div>
  </main>
  <section id="finder" class="finder" hidden></section>
  <script>
    for (const file of ["config.js", "demo.js", "app.js"]) document.write(`<script src="${fresh(file)}"><\/script>`);
  </script>
</body>
</html>
